on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: 'macos version'
        required: false
        type: choice
        default: 'macos-26'
        options:
          - macos-13
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
      platform:
        description: 'choose a platform for compile'
        required: false
        type: choice
        default: 'all'
        options:
          - apple
          - android
          - ohos
          - ios
          - tvos
          - macos
          - all
      libraries:
        description: 'comma-separated libraries in dependency order'
        required: true
        default: 'xml2'
      draft:
        description: 'create a draft release with assets and notes; do not update published dependency tags'
        required: false
        type: choice
        default: 'false'
        options:
          - true
          - false
      verbose:
        description: 'print detail logs'
        required: true
        type: choice
        default: 'false'
        options:
          - true
          - false
  pull_request:
    branches: [master]

name: build custom libs

permissions:
  contents: write

jobs:
  build:
    name: compile ordered libraries for ${{ inputs.platform }} then deploy
    runs-on: ${{ inputs.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Setup HarmonyOS native SDK
      if: inputs.platform == 'ohos' || inputs.platform == 'all'
      shell: bash
      run: python3 .github/workflows/setup-ohos-sdk.py
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      if: |
        github.event.inputs.platform == 'all' ||
        github.event.inputs.platform == 'android'
      with:
        ndk-version: r27c
        add-to-path: true
        link-to-sdk: true
        local-cache: false
    - name: Install cargo-c
      if: contains(inputs.libraries, 'dovi')
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-c
    - name: One Step
      run: |
        set -euo pipefail
        Platform="$BUILD_PLATFORM"
        Draft="$BUILD_DRAFT"
        Verbose="$BUILD_VERBOSE"
        compile_lib() {
          local lib_name=$1
          local platform=$Platform

          if [[ "$lib_name" == "fontconfig" ]]; then
            if [[ "$platform" == "all" ]]; then
              echo "force platform to android for fontconfig"
              platform='android'
            elif [[ "$platform" != "android" && "$platform" != "ohos" ]]; then
              echo "Skip fontconfig for $platform"
              return
            fi
          fi

          if [[ "$lib_name" == "webp" ]]; then
            if [[ "$platform" == "android" ]]; then
              echo "Skip webp for android"
              return
            elif [[ "$platform" == "all" ]]; then
              echo "Skip webp for android"
              platform='apple'
            fi
          fi

          echo "------compile $platform $lib_name------------------------------------"
          rm -rf -- build
          .github/workflows/install-dependencies.sh "$lib_name" "$platform"
          .github/workflows/onestep.sh "$lib_name" "$platform" "$Draft" "$Verbose"
        }

        [[ -n "$BUILD_LIBRARIES" ]] || { echo 'No libraries specified.' >&2; exit 1; }
        IFS=',' read -ra ADDR <<< "$BUILD_LIBRARIES"
        # Validate the complete list before installing or publishing any library.
        for lib in "${ADDR[@]}"; do
          if [[ ! "$lib" =~ ^[a-zA-Z0-9_-]+$ || ! -f "configs/libs/$lib.sh" ]]; then
            echo "Invalid or unknown library: $lib" >&2
            exit 1
          fi
        done
        for lib in "${ADDR[@]}"; do
          compile_lib "$lib"
        done
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
        BUILD_DRAFT: ${{ inputs.draft }}
        BUILD_VERBOSE: ${{ inputs.verbose }}
        BUILD_LIBRARIES: ${{ inputs.libraries }}
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
