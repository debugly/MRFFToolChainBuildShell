# https://github.com/actions/runner-images

on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: 'macos version'
        required: false
        type: choice
        default: 'macos-26'
        options:
          - macos-13
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
      platform:
        description: 'choose a platform for compile'
        required: false
        type: choice
        default: 'all'
        options:
          - apple
          - android
          - ohos
          - all
          - ios
          - tvos
          - macos
      lib:
        description: 'choose a lib for compile'
        required: true
        type: choice
        default: 'ffmpeg8'
        options:
          - test
          - ffmpeg8
          - ffmpeg8-bin
          - ffmpeg7
          - ffmpeg6
          - ffmpeg5
          - ffmpeg4
          - ijkffmpeg
          - fftutorial
          - ass
          - bluray
          - dav1d
          - dvdread
          - dvdnav
          - harfbuzz
          - fontconfig
          - freetype
          - fribidi
          - lcms2
          - placebo
          - moltenvk
          - openssl3
          - openssl
          - opus
          - shaderc
          - smb2
          - soundtouch
          - uavs3d
          - x264
          - x265
          - unibreak
          - yuv
          - xml2
          - webp
          - dovi
      draft:
        description: 'create a draft release with assets and notes; do not update published dependency tags'
        required: false
        type: choice
        default: 'false'
        options:
          - true
          - false
      verbose:
        description: 'print detail logs'
        required: true
        type: choice
        default: 'false'
        options:
          - true
          - false
  pull_request:
    branches: [master]

name: build a lib

jobs:
  build:
    name: compile ${{ inputs.lib }} for ${{ inputs.platform }} then deploy
    runs-on: ${{ inputs.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Setup HarmonyOS native SDK
      if: inputs.platform == 'ohos' || inputs.platform == 'all'
      shell: bash
      run: python3 .github/workflows/setup-ohos-sdk.py
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      if: |
        github.event.inputs.platform == 'all' || 
        github.event.inputs.platform == 'android'
      with:
        ndk-version: r27c
        add-to-path: true
        link-to-sdk: true
        local-cache: false
    - name: Install cargo-c
      if: inputs.lib == 'dovi'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-c
    - name: Install dependencies
      run: .github/workflows/install-dependencies.sh ${{ inputs.lib }} ${{ inputs.platform }}
    - name: One Step
      run: .github/workflows/onestep.sh ${{ inputs.lib }} ${{ inputs.platform }} ${{ inputs.draft }} ${{ inputs.verbose }}
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}